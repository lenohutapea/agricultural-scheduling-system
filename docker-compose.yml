# Run the whole app with:  cp .env.example .env  &&  docker compose up -d --build
services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: pertanian
      MARIADB_USER: ${DB_USER:-pertanian}
      MARIADB_PASSWORD: ${DB_PASS:?Set DB_PASS in .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASS:?Set DB_ROOT_PASS in .env}
    volumes:
      - db-data:/var/lib/mysql
      # runs once, on the first start with an empty volume: tables + sample crops
      - ./database.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build: .
    image: ghcr.io/lenohutapea/agricultural-scheduling-system:latest
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: pertanian
      DB_USER: ${DB_USER:-pertanian}
      DB_PASS: ${DB_PASS:?Set DB_PASS in .env}
      APP_TIMEZONE: Asia/Jakarta
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
