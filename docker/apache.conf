ServerName localhost
ServerTokens Prod
ServerSignature Off

# Internal code is only included by pages, never requested directly
<Directory /var/www/html/includes>
    Require all denied
</Directory>
<Directory /var/www/html/docker>
    Require all denied
</Directory>
<FilesMatch "^(config(\.local)?\.php|database\.sql)$">
    Require all denied
</FilesMatch>

Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "SAMEORIGIN"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
