# Nginx in front of the PHP app

# At most 10 login attempts per minute per client (short bursts allowed)
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_status 429;

# Keep https when the request came through Cloudflare Tunnel
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

upstream php_app {
    server app:80;
    keepalive 16;
}

server {
    listen 80 default_server;
    server_name _;

    server_tokens off;
    client_max_body_size 2m;

    gzip on;
    gzip_types text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;

    location = /login.php {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://php_app;
    }

    # Static files change rarely: let browsers cache them for a day
    location /assets/ {
        proxy_pass http://php_app;
        expires 1d;
    }

    location / {
        proxy_pass http://php_app;
    }
}
