global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # CPU, memory and disk of the Ubuntu host
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # Is the app up? Probes the health endpoint through Nginx, like a real visitor.
  - job_name: app-health
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://nginx/healthz.php"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
